<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Panel de Control - One Cup</title>
    <style>
        body { font-family: 'Inter', sans-serif; padding: 20px; background: #0a0a0a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #111; border: 1px solid #333; padding: 30px; border-radius: 12px; width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color:#ef4444; text-align:center; text-transform: uppercase; letter-spacing: 2px; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { font-size: 11px; color: #888; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 5px; }
        select, input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; font-size: 14px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border-radius: 6px; border: none; background: #ef4444; color: white; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
    </style>
</head>
<body>
<div class="card">
    <h2>DRAFT CONTROL</h2>
    <div class="form-group"><label>Número de Partida</label><input type="number" id="numPartida" value="1"></div>
    <div class="form-group"><label>Team 1 (Asesino)</label><input type="text" id="team1" value="TEAM 1"></div>
    <div class="form-group"><label>Team 2 (Supervivientes)</label><input type="text" id="team2" value="TEAM 2"></div>
    <div class="form-group"><label>Killer</label><select id="selectAsesino" onchange="cargarMapas()"></select></div>
    <div class="form-group"><label>Mapa</label><select id="selectMapa"></select></div>
    <button onclick="actualizar()">Actualizar Overlay</button>
</div>

    };

    const selectK = document.getElementById('selectAsesino');
    Object.entries(nombres).sort((a,b) => a[1].localeCompare(b[1])).forEach(([id, name]) => {
        let opt = document.createElement('option');
        opt.value = id; opt.innerText = name.toUpperCase();
        selectK.appendChild(opt);
    });

    function cargarMapas() {
        const id = selectK.value;
        const selectM = document.getElementById('selectMapa');
        selectM.innerHTML = "";
        if (killerMaps[id]) {
            killerMaps[id].forEach((m, index) => {
                let opt = document.createElement('option');
                opt.value = index; 
                opt.innerText = m.name.toUpperCase();
                selectM.appendChild(opt);
            });
        }
    }

    function actualizar() {
        const killerId = selectK.value;
        const mapaIndex = document.getElementById('selectMapa').value;
        const m = killerMaps[killerId][mapaIndex];

        const data = {
            partida: document.getElementById('numPartida').value,
            team1: document.getElementById('team1').value.toUpperCase(),
            team2: document.getElementById('team2').value.toUpperCase(),
            nombre: nombres[killerId].toUpperCase(),
            mapa_name: m.name.toUpperCase(),
            mapa_img: m.file, 
            imagen: `img/${killerId}.png`
        };
        
        // Enviar a Firebase en lugar de localStorage
        db.ref('dbd_overlay_data').set(data).then(() => {
            console.log("Datos enviados a Firebase");
        });
    }
    cargarMapas();

</body>
</html>
