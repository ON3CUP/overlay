<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Draft Overlay - One Cup</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto+Condensed:wght@400;700&display=swap');

        body, html {
            margin: 0; padding: 0;
            width: 1920px; height: 1080px;
            overflow: hidden; background: transparent;
            font-family: 'Roboto Condensed', sans-serif;
            color: white;
        }

        .overlay-main-grid {
            width: 100%; height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            padding: 100px;
            box-sizing: border-box;
            align-items: center;
            background-color: #050505; 
            background-image: radial-gradient(circle at 30% 50%, rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0.9) 100%), url('./img/fondo.png'); 
            background-repeat: no-repeat; background-position: center center; background-size: cover;
        }

        .info-column { display: flex; flex-direction: column; gap: 40px; align-items: flex-start; }
        .partida-block { display: flex; align-items: center; gap: 15px; }
        .line-red { width: 60px; height: 4px; background: #ef4444; }
        .partida-tag { font-family: 'Oswald', sans-serif; font-size: 30px; color: #888; margin: 0; letter-spacing: 4px; font-weight: 500; }

        .vs-block { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        .team-row { display: flex; align-items: center; gap: 20px; background: rgba(0,0,0,0.5); padding: 15px 25px; border-radius: 8px; border-left: 5px solid transparent; width: 90%; }
        .team-row.t1 { border-left-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .team-row.t2 { border-left-color: #eee; background: rgba(255, 255, 255, 0.05); }

        .role-icon { width: 50px; height: 50px; object-fit: contain; filter: drop-shadow(0 0 5px rgba(0,0,0,0.5)); }
        .team-row.t1 .role-icon { filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.6)); }

        .team-name { font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .vs-divider { font-family: 'Oswald', sans-serif; font-size: 18px; color: #ef4444; font-weight: bold; margin-left: 100px; }

        .killer-name-block { margin-top: 20px; }
        .label-selection { font-size: 14px; text-transform: uppercase; letter-spacing: 3px; color: #ef4444; font-weight: bold; margin-bottom: 10px; display: block; }
        .killer-name-text { font-family: 'Oswald', sans-serif; font-size: 90px; color: white; text-transform: uppercase; margin: 0; line-height: 0.9; text-shadow: 0 0 30px rgba(239, 68, 68, 0.5); }

        .visual-column { display: flex; flex-direction: column; gap: 40px; align-items: center; }
        .frame { border: 4px solid #222; background: #000; box-shadow: 0 20px 60px rgba(0,0,0,0.8); overflow: hidden; border-radius: 4px; }
        .killer-frame { width: 350px; height: 500px; }
        
        .map-display { display: grid; grid-template-columns: 200px 1fr; gap: 20px; align-items: center; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; width: 500px; border: 1px solid #222; }
        .map-frame { width: 200px; height: 112px; }
        .map-info { display: flex; flex-direction: column; justify-content: center; }
        .map-name-text { font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: 700; color: white; text-transform: uppercase; line-height: 1.1; }

        .dynamic-img { width: 100%; height: 100%; object-fit: cover; display: none; }
    </style>
</head>
<body>
    <div class="overlay-main-grid">
        <div class="info-column">
            <div class="partida-block">
                <div class="line-red"></div>
                <p class="partida-tag" id="partidaNum">PARTIDA --</p>
            </div>
            <div class="vs-block">
                <div class="team-row t1">
                    <img src="img/killer_icon.png" class="role-icon" alt="Killer">
                    <span id="t1Name" class="team-name">Esperando...</span>
                </div>
                <div class="vs-divider">VS</div>
                <div class="team-row t2">
                    <img src="img/surv_icon.png" class="role-icon" alt="Survs">
                    <span id="t2Name" class="team-name">Esperando...</span>
                </div>
            </div>
            <div class="killer-name-block">
                <span class="label-selection">Selección de Asesino</span>
                <h1 class="killer-name-text" id="killerName">--</h1>
            </div>
        </div>
        <div class="visual-column">
            <div class="frame killer-frame">
                <img src="" id="killerImg" class="dynamic-img">
            </div>
            <div class="map-display">
                <div class="frame map-frame">
                    <img src="" id="mapImg" class="dynamic-img">
                </div>
                <div class="map-info">
                    <div class="map-name-text" id="mapName">Nombre del Mapa</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBS7uwcZNsSOMtfwIJzewDeACX22fWeaBY",
            authDomain: "dbd-overlay.firebaseapp.com",
            projectId: "dbd-overlay",
            storageBucket: "dbd-overlay.firebasestorage.app",
            messagingSenderId: "203271324111",
            appId: "1:203271324111:web:70de037a810ca9412a52ba",
            measurementId: "G-FK2D3VXRD9",
            databaseURL: "https://dbd-overlay-default-rtdb.firebaseio.com"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Escuchar cambios en tiempo real desde Firebase
        db.ref('dbd_overlay_data').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('partidaNum').innerText = "PARTIDA " + data.partida;
                document.getElementById('t1Name').innerText = data.team1 || "TEAM 1";
                document.getElementById('t2Name').innerText = data.team2 || "TEAM 2";
                document.getElementById('killerName').innerText = data.nombre || "ESPERANDO";
                document.getElementById('mapName').innerText = (data.mapa_name || "ESPERANDO MAPA").toUpperCase();
                
                if(data.imagen) {
                    const kImg = document.getElementById('killerImg');
                    kImg.src = data.imagen;
                    kImg.style.display = 'block';
                }
                if(data.mapa_img) {
                    const mImg = document.getElementById('mapImg');
                    mImg.src = `img/${data.mapa_img}`;
                    mImg.style.display = 'block';
                }
            }
        });
    </script>
</body>
</html>
